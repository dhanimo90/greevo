version: '3.8'

# Scale deployment - Kubernetes-ready with observability
# Usage: docker-compose -f docker-compose.yml -f docker-compose.scale.yml up -d

services:
  n8n:
    container_name: greevo-n8n-main
    environment:
      - EXECUTIONS_MODE=queue
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - N8N_METRICS=true
      - N8N_METRICS_PREFIX=greevo_
      - N8N_LOG_LEVEL=warn
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  n8n-worker-1:
    image: n8nio/n8n:latest
    container_name: greevo-worker-1
    restart: always
    command: worker
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-primary
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-greevo}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-greevo}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - EXECUTIONS_MODE=queue
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Jakarta}
    depends_on:
      - redis
      - postgres-primary
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    networks:
      - greevo-network

  n8n-worker-2:
    image: n8nio/n8n:latest
    container_name: greevo-worker-2
    restart: always
    command: worker
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-primary
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-greevo}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-greevo}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD}
      - QUEUE_BULL_REDIS_HOST=redis
      - QUEUE_BULL_REDIS_PORT=6379
      - EXECUTIONS_MODE=queue
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Jakarta}
    depends_on:
      - redis
      - postgres-primary
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    networks:
      - greevo-network

  postgres-primary:
    image: postgres:15-alpine
    container_name: greevo-pg-primary
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-greevo}
      - POSTGRES_USER=${POSTGRES_USER:-greevo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: >
      postgres
        -c shared_buffers=1GB
        -c effective_cache_size=3GB
        -c maintenance_work_mem=256MB
        -c work_mem=8MB
        -c max_connections=300
        -c wal_level=replica
        -c max_wal_senders=3
        -c max_replication_slots=3
        -c hot_standby=on
        -c log_min_duration_statement=500
    volumes:
      - pg_primary_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
    networks:
      - greevo-network

  postgres-replica:
    image: postgres:15-alpine
    container_name: greevo-pg-replica
    restart: always
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-greevo}
      - POSTGRES_USER=${POSTGRES_USER:-greevo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    command: >
      postgres
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c hot_standby=on
        -c max_connections=200
    volumes:
      - pg_replica_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    networks:
      - greevo-network

  redis:
    image: redis:7-alpine
    container_name: greevo-redis-scale
    restart: always
    command: >
      redis-server
        --maxmemory 512mb
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --save 60 1000
    deploy:
      resources:
        limits:
          memory: 768M
    networks:
      - greevo-network

  # Observability Stack
  prometheus:
    image: prom/prometheus:latest
    container_name: greevo-prometheus
    restart: always
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    networks:
      - greevo-network

  grafana:
    image: grafana/grafana:latest
    container_name: greevo-grafana
    restart: always
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    networks:
      - greevo-network

  # CDN / Static asset cache
  nginx-cdn:
    image: nginx:alpine
    container_name: greevo-cdn
    restart: always
    volumes:
      - ./nginx/cdn.conf:/etc/nginx/conf.d/default.conf
      - cdn_cache:/var/cache/nginx
    ports:
      - "8080:80"
    networks:
      - greevo-network

volumes:
  pg_primary_data:
  pg_replica_data:
  prometheus_data:
  grafana_data:
  cdn_cache:

networks:
  greevo-network:
    driver: bridge
