version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: greevo-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-changeme}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://${N8N_HOST:-localhost}:5678/
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${POSTGRES_DB:-greevo}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-greevo}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-greevo_secret}
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=168
      - GENERIC_TIMEZONE=${TIMEZONE:-Asia/Jakarta}
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - greevo-network

  postgres:
    image: postgres:15-alpine
    container_name: greevo-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-greevo}
      - POSTGRES_USER=${POSTGRES_USER:-greevo}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-greevo_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greevo}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - greevo-network

  redis:
    image: redis:7-alpine
    container_name: greevo-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - greevo-network

volumes:
  n8n_data:
  postgres_data:
  redis_data:

networks:
  greevo-network:
    driver: bridge
