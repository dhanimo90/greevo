proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=static_cache:10m max_size=1g inactive=60m;

server {
    listen 80;
    server_name _;

    # Cache static assets from dashboard
    location /static/ {
        proxy_cache static_cache;
        proxy_cache_valid 200 7d;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status;
        add_header Cache-Control "public, max-age=604800";

        proxy_pass http://dashboard:3000;
    }

    # Cache API responses (short TTL)
    location /api/cached/ {
        proxy_cache static_cache;
        proxy_cache_valid 200 60s;
        add_header X-Cache-Status $upstream_cache_status;

        proxy_pass http://n8n:5678/webhook/portal/;
    }

    # Health check
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }

    # Nginx status for Prometheus
    location /nginx_status {
        stub_status on;
        allow 127.0.0.0/8;
        allow 172.16.0.0/12;
        deny all;
    }
}
